name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage ruff

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Run unittests
        run: python -m unittest tests.test_smoke -v

      - name: Run with coverage
        run: |
          coverage run --source=scripts -m unittest tests.test_smoke
          coverage report
          coverage xml

      # NOTE: coverage threshold starts low and ratchets up per release.
      # v0.1.1: 30% minimum (current ~20%, gives breathing room).
      # v0.2.0: 60%.
      # v0.3.0: 80% on packages, 60% on orchestrators.
      - name: Enforce minimum coverage
        run: coverage report --fail-under=30

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
