[project]
name = "norteia-lead-recon"
version = "0.1.1"
description = "Discovery + análisis de leads B2B en España sobre fuentes oficiales gratuitas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NorteIA / Forja de Camaleones" }]
keywords = ["lead-generation", "b2b", "spain", "borme", "official-sources", "gdpr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/Luispitik/norteia-lead-recon"
Issues = "https://github.com/Luispitik/norteia-lead-recon/issues"
Changelog = "https://github.com/Luispitik/norteia-lead-recon/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["fixtures", ".cache"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
]
ignore = [
  "E501",   # line-too-long handled by formatter
  "B008",   # function call in default argument (pragmatic for the helpers)
  "B904",   # raise from in except (pragmatic)
  "UP007",  # X | Y syntax requires 3.10+, fine but noisy in this MVP
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.coverage.run]
source = ["scripts"]
omit = ["scripts/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
